<!DOCTYPE html>
<html lang="pt-br" id="html">
<head id="head">
    <meta charset="UTF-8" id="meta-charset">
    <title id="titulo-aba">Explorando eventos</title>
</head>
<body id="corpo">
    <button id="alertButton">Clique aqui</button>
    <input type="text" id="textInput" placeholder="Digite algo">
    <div id="hoverDiv">Passe o mouse aqui</div>
    <select id="colorSelect">
        <option value="">Escolha uma cor</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Vermelho</option>
    </select>

    <script id="script">
        document.getElementById("alertButton").onclick = function() {
            alert("Você clicou no botão!");
        };

        document.getElementById("textInput").onkeydown = function(event) {
            console.log("Tecla: " + event.key);
        };

        document.getElementById("textInput").onfocus = function() {
            document.getElementById("textInput").style.backgroundColor = "yellow";
        };

        document.getElementById("textInput").onblur = function() {
            document.getElementById("textInput").style.backgroundColor = "";
        };

        document.getElementById("hoverDiv").onmouseover = function() {
            document.getElementById("hoverDiv").style.backgroundColor = "lightblue";
        };

        document.getElementById("hoverDiv").onmouseout = function() {
            document.getElementById("hoverDiv").style.backgroundColor = "";
        };

        document.getElementById("colorSelect").onchange = function() {
            document.getElementById("corpo").style.backgroundColor = document.getElementById("colorSelect").value;
        };
    </script>
</body>
</html>
