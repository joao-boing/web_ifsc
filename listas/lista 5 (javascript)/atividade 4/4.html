<!DOCTYPE html>
<html lang="pt-br" id="html">
<head id="head">
    <meta charset="UTF-8" id="meta-charset">
    <title id="titulo-aba">Cálculo de IMC</title>
</head>
<body id="corpo">

    <h1 id="titulo">Cálculo de IMC</h1>

    <label for="nome" id="lnome">Nome:</label>
    <input type="text" id="nome"><br><br>

    <label for="peso" id="lpeso">Peso (kg):</label>
    <input type="number" id="peso" step="0.1"><br><br>

    <label for="altura" id="laltura">Altura (m):</label>
    <input type="number" id="altura" step="0.01"><br><br>

    <button id="botao" onclick="calcular()">Calcular</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>
    <img id="imgPerfil" src="" alt="" width="200" height="400">

    <script id="script">
        function calcular() {
            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (nome == "" || isNaN(peso) || isNaN(altura)) {
                alert("Preencha todos os campos!");
                return;
            }

            let imc = peso / (altura * altura);
            document.getElementById("resultadoIMC").innerText = nome + ", seu IMC é " + imc.toFixed(2);

            let classificacao;
            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else if (imc < 35) {
                classificacao = "Obesidade grau 1";
            } else if (imc < 40) {
                classificacao = "Obesidade grau 2";
            } else {
                classificacao = "Obesidade grau 3 (mórbida)";
            }
            document.getElementById("classificacao").innerText = "Classificação: " + classificacao;

            let faixa = Math.floor(imc);
            let imagem;
            switch (true) {
                case faixa < 18:
                    imagem = "img/abaixopese.png";
                    break;
                case faixa < 25:
                    imagem = "img/normal.png";
                    break;
                case faixa < 30:
                    imagem = "img/sobrepeso.png";
                    break;
                case faixa < 35:
                    imagem = "img/obesidade1.png";
                    break;
                case faixa < 40:
                    imagem = "img/obesidade2.png";
                    break;
                default:
                    imagem = "img/obesidade3.png";
            }
            document.getElementById("imgPerfil").src = imagem;
            document.getElementById("imgPerfil").alt = classificacao;
        }
    </script>

</body>
</html>
