<!DOCTYPE html>
<html lang="pt-br" id="html">
<head id="head">
    <meta charset="UTF-8" id="meta-charset">
    <title id="titulo-aba">Local Storage</title>
</head>
<body id="corpo">
    <input type="text" id="nameInput" placeholder="Digite seu nome">
    <button id="saveButton">Salvar</button>
    <p id="greeting"></p>

    <script id="script">
        function mostrarSaudacao() {
            let nome = localStorage.getItem("nome");

            if(nome != null) {
                document.getElementById("greeting").innerHTML = "Olá, " + nome + "!";
            } else {
                document.getElementById("greeting").innerHTML = "Nenhum nome salvo ainda.";
            }
        }

        document.getElementById("saveButton").onclick = function() {
            let nome = document.getElementById("nameInput").value;

            if(nome == "") {
                document.getElementById("greeting").innerHTML = "Digite um nome antes de salvar.";
            } else {
                localStorage.setItem("nome", nome);
                mostrarSaudacao();
            }
        };

        mostrarSaudacao();
    </script>
</body>
</html>
